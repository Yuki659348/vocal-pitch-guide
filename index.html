<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VOICE PITCH MONITOR</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        body { font-family: 'Rajdhani', sans-serif; background-color: #05070a; color: #e2e8f0; overflow: hidden; height: 100dvh; }
        .font-digital { font-family: 'Orbitron', sans-serif; }
    </style>
</head>
<body class="flex flex-col h-[100dvh]">

    <header class="flex-none flex justify-between items-center p-4 border-b border-gray-800">
        <h1 class="text-sm font-bold tracking-widest text-white/70">PITCH MONITOR LITE</h1>
        <div id="status-pulse" class="w-2 h-2 rounded-full bg-gray-700"></div>
    </header>

    <main class="flex-grow flex flex-col p-4 gap-4">
        <div class="bg-gray-900/40 p-4 rounded-2xl border border-gray-800">
            <div id="current-note" class="font-digital text-5xl font-black text-white">--</div>
            <div id="current-hz" class="text-sm text-gray-400 font-digital">0.00 Hz</div>
        </div>
        <section class="flex-grow bg-black/20 border border-gray-800 rounded-2xl p-2 relative overflow-hidden">
            <canvas id="pitch-canvas" class="w-full h-full block"></canvas>
        </section>
    </main>

    <footer class="p-4">
        <button id="btn-toggle-mic" class="w-full bg-[#00e5ff]/10 border border-[#00e5ff]/30 text-[#00e5ff] py-4 rounded-xl font-bold">
            マイクを有効化
        </button>
    </footer>

    <script>
        let audioContext, analyser, micStream, isRunning = false;
        let pitchHistory = new Float32Array(200); 
        let timeDomainData = new Float32Array(8192);
        
        const canvas = document.getElementById('pitch-canvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        const btnToggleMic = document.getElementById('btn-toggle-mic');
        
        function autoCorrelate(buffer, sampleRate) {
            let size = buffer.length;
            let rms = 0;
            for (let i = 0; i < size; i++) rms += buffer[i] * buffer[i];
            if (Math.sqrt(rms / size) < 0.002) return -1;
            
            let c = new Float32Array(size);
            for (let i = 0; i < size; i++) for (let j = 0; j < size - i; j++) c[i] += buffer[j] * buffer[j + i];
            
            let bestT = -1, threshold = 0.3 * c[0];
            for (let i = 1; i < size; i++) if (c[i] > threshold && c[i] > c[i-1] && c[i] > c[i+1]) { bestT = i; break; }
            
            if (bestT > 0 && bestT < size - 1) {
                let s1 = c[bestT - 1], s2 = c[bestT], s3 = c[bestT + 1];
                return sampleRate / (bestT + (s1 - s3) / (2 * (s1 - 2 * s2 + s3)));
            }
            return -1;
        }

        async function startMonitoring() {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            const source = audioContext.createMediaStreamSource(micStream);
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 8192; // 負荷軽減のために8192へ
            source.connect(analyser);
            isRunning = true;
            btnToggleMic.textContent = "停止";
            requestAnimationFrame(updateLoop);
        }

        function updateLoop() {
            if (!isRunning) return;
            analyser.getFloatTimeDomainData(timeDomainData);
            const pitch = autoCorrelate(timeDomainData, audioContext.sampleRate);
            
            if (pitch > 40) {
                const noteNames = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
                const midi = Math.round(12 * Math.log2(pitch / 440) + 69);
                document.getElementById('current-note').textContent = noteNames[midi % 12];
                document.getElementById('current-hz').textContent = pitch.toFixed(1) + " Hz";
            }
            
            // 描画の簡略化
            ctx.fillStyle = '#05070a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = '#00e5ff';
            ctx.lineWidth = 2;
            ctx.beginPath();
            for(let i=0; i<canvas.width; i+=10) {
                ctx.moveTo(i, canvas.height/2 + Math.sin(i*0.05 + Date.now()*0.01)*50);
                ctx.lineTo(i+5, canvas.height/2 + Math.sin((i+5)*0.05 + Date.now()*0.01)*50);
            }
            ctx.stroke();
            
            requestAnimationFrame(updateLoop);
        }

        btnToggleMic.onclick = () => isRunning ? location.reload() : startMonitoring();
    </script>
</body>
</html>
