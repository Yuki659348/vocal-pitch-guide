<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VOICE PITCH MONITOR</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3231/3231365.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        body { 
            font-family: 'Rajdhani', 'Noto Sans JP', sans-serif; 
            background-color: #05070a; 
            color: #e2e8f0; 
            overflow: hidden; 
            height: 100dvh;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }
        .font-digital { font-family: 'Orbitron', sans-serif; }
        input[type=range] { accent-color: #00e5ff; }
    </style>
</head>
<body class="flex flex-col h-[100dvh]">

    <header class="flex-none flex justify-between items-center bg-gray-950/50 p-4 border-b border-gray-800 backdrop-blur-md">
        <h1 class="text-sm font-bold tracking-widest text-white/70">
            <span class="text-[#00e5ff] font-digital">PITCH MONITOR</span>
        </h1>
        <div id="status-pulse" class="w-2 h-2 rounded-full bg-gray-700"></div>
    </header>

    <main class="flex-grow flex flex-col md:flex-row p-4 gap-4 overflow-hidden min-h-0">
        
        <section class="flex-none md:w-80 bg-gray-900/40 border border-gray-800 rounded-2xl p-6 flex flex-col gap-4 overflow-y-auto">
            <div class="text-center">
                <div id="current-note" class="font-digital text-5xl font-black text-gray-700 transition-colors duration-300">--</div>
                <div id="current-hz" class="text-lg text-gray-500 font-digital mt-1">0.00 Hz</div>
            </div>
            
            <div class="space-y-4">
                <select id="range-select" class="w-full bg-gray-800 text-white p-2 rounded-lg border border-gray-700 text-center font-digital">
                    <option value="low">低域 (60-400Hz)</option>
                    <option value="mid" selected>中域 (200-800Hz)</option>
                    <option value="high">高域 (600-1500Hz)</option>
                </select>

                <div class="space-y-1">
                    <div class="flex justify-between text-[10px] text-gray-500 uppercase tracking-widest">
                        <span>表示倍率 (Zoom)</span>
                        <span id="zoom-val">1.0x</span>
                    </div>
                    <input id="zoom-slider" type="range" min="0.05" max="2.0" step="0.05" value="1.0" class="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer">
                </div>
            </div>
            
            <div class="mt-auto grid grid-cols-2 gap-4 text-center pt-4">
                <div class="bg-black/20 p-2 rounded-lg">
                    <div class="text-[10px] text-gray-500">ビブラート</div>
                    <div id="vibrato-val" class="font-digital text-lg text-[#00ff9d]">0.0</div>
                </div>
                <div class="bg-black/20 p-2 rounded-lg">
                    <div class="text-[10px] text-gray-500">ステータス</div>
                    <div id="change-val" class="font-digital text-lg text-[#ff007f]">--</div>
                </div>
            </div>
        </section>

        <section class="flex-grow bg-black/20 border border-gray-800 rounded-2xl p-2 relative overflow-hidden min-h-[200px]">
            <canvas id="pitch-canvas" class="w-full h-full block"></canvas>
        </section>
    </main>

    <footer class="flex-none p-4 pb-[max(1rem,env(safe-area-inset-bottom))]">
        <button id="btn-toggle-mic" class="w-full bg-[#00e5ff]/10 border border-[#00e5ff]/30 text-[#00e5ff] hover:bg-[#00e5ff]/20 font-bold py-4 rounded-xl flex items-center justify-center gap-3 transition active:scale-95">
            <i class="fa-solid fa-microphone"></i> <span id="btn-text">マイクを有効化</span>
        </button>
    </footer>

    <script>
        let audioContext = null, analyser = null, biquadFilter = null, micStream = null, isRunning = false;
        let pitchHistory = [], smoothedPitch = 0, vibratoBuffer = [];
        
        const canvas = document.getElementById('pitch-canvas');
        const ctx = canvas.getContext('2d');
        const zoomSlider = document.getElementById('zoom-slider'), zoomValEl = document.getElementById('zoom-val');
        const currentNoteEl = document.getElementById('current-note'), currentHzEl = document.getElementById('current-hz');
        const rangeSelect = document.getElementById('range-select');
        const statusPulse = document.getElementById('status-pulse'), btnToggleMic = document.getElementById('btn-toggle-mic'), btnText = document.getElementById('btn-text');
        const vibratoEl = document.getElementById('vibrato-val');

        const ranges = { low: [60, 400], mid: [200, 800], high: [600, 1500] };

        function resizeCanvas() {
            canvas.width = canvas.clientWidth * window.devicePixelRatio;
            canvas.height = canvas.clientHeight * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        zoomSlider.addEventListener('input', (e) => zoomValEl.textContent = parseFloat(e.target.value).toFixed(2) + "x");

        function autoCorrelate(buffer, sampleRate) {
            let size = buffer.length, rms = 0;
            for (let i = 0; i < size; i++) rms += buffer[i] * buffer[i];
            rms = Math.sqrt(rms / size);
            if (rms < 0.01) return -1;
            let c = new Float32Array(size);
            for (let i = 0; i < size; i++) for (let j = 0; j < size - i; j++) c[i] += buffer[j] * buffer[j + i];
            let bestT = -1, threshold = 0.2 * c[0];
            for (let i = 1; i < size; i++) if (c[i] > threshold && c[i] > c[i-1] && c[i] > c[i+1]) { bestT = i; break; }
            return bestT === -1 ? -1 : sampleRate / bestT;
        }

        async function startMonitoring() {
            try {
                if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
                if (audioContext.state === 'suspended') await audioContext.resume();
                micStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
                const source = audioContext.createMediaStreamSource(micStream);
                analyser = audioContext.createAnalyser(); analyser.fftSize = 2048;
                biquadFilter = audioContext.createBiquadFilter(); biquadFilter.type = "lowpass"; biquadFilter.frequency.value = 2000; 
                source.connect(biquadFilter); biquadFilter.connect(analyser);
                isRunning = true; btnText.textContent = "停止"; statusPulse.className = "w-2 h-2 rounded-full bg-emerald-400 animate-pulse";
                requestAnimationFrame(updateLoop);
            } catch (e) { console.error(e); }
        }

        function stopMonitoring() { 
            if (micStream) micStream.getTracks().forEach(t => t.stop());
            isRunning = false; btnText.textContent = "マイクを有効化"; statusPulse.className = "w-2 h-2 rounded-full bg-gray-700"; 
        }
        btnToggleMic.addEventListener('click', () => isRunning ? stopMonitoring() : startMonitoring());

        function updateLoop() {
            if (!isRunning) return;
            const data = new Float32Array(analyser.fftSize); analyser.getFloatTimeDomainData(data);
            const pitch = autoCorrelate(data, audioContext.sampleRate);
            const displayW = canvas.width / window.devicePixelRatio;
            const displayH = canvas.height / window.devicePixelRatio;

            if (pitch > 50 && pitch < 2000) {
                smoothedPitch = (pitch * 0.1) + (smoothedPitch * 0.9);
                pitchHistory.push(smoothedPitch); if (pitchHistory.length > 400) pitchHistory.shift();
                
                vibratoBuffer.push(smoothedPitch); if (vibratoBuffer.length > 30) vibratoBuffer.shift();
                let variance = vibratoBuffer.reduce((a,b)=>a + Math.pow(b - (vibratoBuffer.reduce((s,v)=>s+v)/30), 2), 0) / 30;
                vibratoEl.textContent = Math.sqrt(variance).toFixed(1);

                const midi = Math.round(12 * Math.log2(smoothedPitch / 440) + 69);
                const noteNames = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
                currentNoteEl.textContent = noteNames[midi % 12];
                currentHzEl.textContent = smoothedPitch.toFixed(1) + " Hz";

                const zoom = parseFloat(zoomSlider.value);
                const [baseMin, baseMax] = ranges[rangeSelect.value];
                const rangeWidth = (baseMax - baseMin) / zoom;
                const min = Math.max(0, smoothedPitch - (rangeWidth / 2));
                const max = Math.min(2000, smoothedPitch + (rangeWidth / 2));

                ctx.clearRect(0, 0, displayW, displayH);
                
                // グリッド線の描画
                ctx.strokeStyle = "rgba(255, 255, 255, 0.05)";
                ctx.lineWidth = 1;
                for (let i = 0; i <= 8; i++) {
                    let y = displayH * (i / 8);
                    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(displayW, y); ctx.stroke();
                }

                // ピッチ履歴の描画（左から右へ流れる）
                ctx.beginPath();
                ctx.strokeStyle = "#00e5ff";
                ctx.lineWidth = 4;
                ctx.lineJoin = "round";
                pitchHistory.forEach((p, i) => {
                    let x = (i / 400) * displayW;
                    let y = displayH - ((p - min) / (max - min)) * displayH;
                    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
                });
                ctx.stroke();

                // 現在位置の強調
                const lastIdx = pitchHistory.length - 1;
                const lastX = (lastIdx / 400) * displayW;
                const lastY = displayH - ((pitchHistory[lastIdx] - min) / (max - min)) * displayH;
                ctx.fillStyle = "#ff007f";
                ctx.beginPath(); ctx.arc(lastX, lastY, 6, 0, Math.PI * 2); ctx.fill();
            }
            requestAnimationFrame(updateLoop);
        }
    </script>
</body>
</html>
