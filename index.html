<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VOICE PITCH MONITOR</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Rajdhani', sans-serif; background-color: #05070a; color: #e2e8f0; overflow: hidden; height: 100vh; }
        .font-digital { font-family: 'Orbitron', sans-serif; }
        .vibrato-gradient { background: linear-gradient(90deg, #3b82f6, #ec4899, #f59e0b); }
        .input-gradient { background: linear-gradient(90deg, #10b981, #3b82f6); }
        input[type=range] { accent-color: #06b6d4; }
    </style>
</head>
<body class="flex flex-col h-screen">

    <header class="flex-none flex justify-between items-center p-4 border-b border-gray-800">
        <h1 class="text-xs font-bold tracking-widest text-white/50">PROFESSIONAL PITCH & VIBRATO ANALYZER</h1>
        <div id="status-pulse" class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></div>
    </header>

    <main class="flex-grow flex flex-col p-4 gap-4 overflow-hidden">
        <div class="grid grid-cols-2 gap-4">
            <div class="bg-gray-900/40 p-5 rounded-2xl border border-gray-800">
                <div id="current-note" class="font-digital text-4xl font-black text-white leading-none">--</div>
                <div id="current-hz" class="text-xs text-gray-400 font-digital mt-1">0.00 Hz</div>
            </div>
            <div class="bg-gray-900/40 p-3 rounded-2xl border border-gray-800 flex flex-col justify-between">
                <div>
                    <div class="flex justify-between text-[9px] text-gray-500 uppercase font-bold tracking-widest mb-1">
                        <span>Vibrato Depth</span><span id="vibrato-percent">0%</span>
                    </div>
                    <div class="h-1.5 w-full bg-black rounded-full overflow-hidden mb-2">
                        <div id="vibrato-meter" class="h-full w-0 vibrato-gradient transition-all duration-300"></div>
                    </div>
                </div>
                <div>
                    <div class="flex justify-between text-[9px] text-gray-500 uppercase font-bold tracking-widest mb-1">
                        <span>Input Level</span><span id="input-percent">0%</span>
                    </div>
                    <div class="h-1.5 w-full bg-black rounded-full overflow-hidden">
                        <div id="input-meter" class="h-full w-0 input-gradient transition-all duration-100"></div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="bg-gray-900/40 px-4 py-3 rounded-xl border border-gray-800 flex flex-col gap-3">
            <div class="flex items-center gap-4">
                <span class="text-[10px] text-gray-500 uppercase font-bold tracking-widest w-12">Vert (Zoom)</span>
                <input type="range" id="v-zoom" min="1" max="20" value="10" class="w-full h-1 bg-gray-700 rounded-lg appearance-none cursor-pointer">
                <span id="v-val" class="text-[10px] w-8 text-right font-digital text-cyan-400">10%</span>
            </div>
            <div class="flex items-center gap-4">
                <span class="text-[10px] text-gray-500 uppercase font-bold tracking-widest w-12">Horiz (Time)</span>
                <input type="range" id="h-zoom" min="20" max="300" value="100" class="w-full h-1 bg-gray-700 rounded-lg appearance-none cursor-pointer">
                <span id="h-val" class="text-[10px] w-8 text-right font-digital text-pink-400">100</span>
            </div>
        </div>

        <div class="bg-gray-900/40 p-4 rounded-2xl border border-gray-800">
            <div class="mt-2 w-full h-8 bg-black rounded-lg border border-gray-700 relative flex items-center">
                <div id="needle" class="absolute w-0.5 h-8 bg-cyan-400 transition-all duration-300 ease-out z-20 left-1/2"></div>
            </div>
        </div>
        
        <div class="flex-grow bg-black/20 border border-gray-800 rounded-2xl p-1 relative overflow-hidden">
            <canvas id="pitch-canvas" class="w-full h-full"></canvas>
        </div>
    </main>

    <footer class="p-4">
        <button id="btn-toggle-mic" class="w-full bg-cyan-900/30 border border-cyan-500/30 text-cyan-400 py-4 rounded-xl font-bold tracking-wider hover:bg-cyan-900/50 transition">
            マイクを有効化
        </button>
    </footer>

    <script>
        let audioContext, analyser, timeDomainData, isRunning = false;
        let pitchHistory = [], smoothedPitch = 0, silenceCount = 0;
        const HOLD_THRESHOLD = 15, MAX_HISTORY = 300, SMOOTHING = 0.04;
        
        const canvas = document.getElementById('pitch-canvas'), ctx = canvas.getContext('2d', { alpha: false });
        const needle = document.getElementById('needle'), vibratoMeter = document.getElementById('vibrato-meter'), inputMeter = document.getElementById('input-meter');
        const vSlider = document.getElementById('v-zoom'), hSlider = document.getElementById('h-zoom');

        function resize() {
            canvas.width = canvas.clientWidth * window.devicePixelRatio;
            canvas.height = canvas.clientHeight * window.devicePixelRatio;
        }
        window.onresize = resize; resize();

        function getRMS(buffer) {
            let sum = 0;
            for(let i=0; i<buffer.length; i++) sum += buffer[i] * buffer[i];
            return Math.sqrt(sum / buffer.length);
        }

        function autoCorrelate(buffer, sampleRate) {
            let size = buffer.length, rms = getRMS(buffer);
            if (rms < 0.005) return { pitch: -1, rms };
            
            let c = new Float32Array(size);
            for (let i = 0; i < size; i++) for (let j = 0; j < size - i; j++) c[i] += buffer[j] * buffer[j + i];
            let bestT = -1, threshold = 0.2 * c[0];
            for (let i = 1; i < size; i++) if (c[i] > threshold && c[i] > c[i-1] && c[i] > c[i+1]) { bestT = i; break; }
            return { pitch: bestT > 0 ? sampleRate / bestT : -1, rms };
        }

        async function start() {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 2048;
            timeDomainData = new Float32Array(analyser.fftSize);
            audioContext.createMediaStreamSource(stream).connect(analyser);
            isRunning = true;
            document.getElementById('btn-toggle-mic').textContent = "停止";
            requestAnimationFrame(draw);
        }

        function draw() {
            if (!isRunning) return;
            analyser.getFloatTimeDomainData(timeDomainData);
            const res = autoCorrelate(timeDomainData, audioContext.sampleRate);
            
            inputMeter.style.width = Math.min(100, res.rms * 500) + "%";
            document.getElementById('input-percent').textContent = Math.round(res.rms * 500) + "%";

            if (res.pitch > 40 && res.pitch < 2000) {
                silenceCount = 0;
                smoothedPitch = (SMOOTHING * res.pitch) + ((1.0 - SMOOTHING) * (smoothedPitch || res.pitch));
                pitchHistory.push(smoothedPitch);
                if (pitchHistory.length > MAX_HISTORY) pitchHistory.shift();

                const midiNote = Math.round(12 * Math.log2(smoothedPitch / 440) + 69);
                const cents = 1200 * Math.log2(smoothedPitch / (440 * Math.pow(2, (midiNote - 69) / 12)));
                
                const vibratoDepth = Math.max(...pitchHistory) - Math.min(...pitchHistory);
                const vPercent = Math.min(100, (vibratoDepth / smoothedPitch) * 100);
                vibratoMeter.style.width = vPercent + "%";
                document.getElementById('vibrato-percent').textContent = Math.round(vPercent) + "%";

                needle.style.left = `${Math.max(0, Math.min(100, (cents + 50)))}%`;
                document.getElementById('current-note').textContent = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"][midiNote % 12];
                document.getElementById('current-hz').textContent = smoothedPitch.toFixed(1) + " Hz";
            } else {
                silenceCount++;
                if (silenceCount > HOLD_THRESHOLD) {
                    document.getElementById('current-note').textContent = "--";
                    document.getElementById('current-hz').textContent = "0.00 Hz";
                }
            }

            ctx.fillStyle = '#05070a'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            const vZoom = vSlider.value / 100;
            const hZoom = hSlider.value;
            document.getElementById('v-val').textContent = vSlider.value + "%";
            document.getElementById('h-val').textContent = hZoom;

            const range = smoothedPitch * vZoom;
            const yMin = smoothedPitch - range;
            const yMax = smoothedPitch + range;

            ctx.strokeStyle = '#f472b6'; 
            ctx.lineWidth = 3; 
            ctx.lineJoin = 'round';
            ctx.beginPath();

            // 横方向の表示数（hZoom）を制限
            const startIdx = Math.max(0, pitchHistory.length - hZoom);
            const visibleHistory = pitchHistory.slice(startIdx);

            visibleHistory.forEach((p, i) => {
                const x = (i / (hZoom - 1)) * canvas.width;
                let y = canvas.height - ((p - yMin) / (yMax - yMin)) * canvas.height;
                y = Math.max(0, Math.min(canvas.height, y));
                i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
            });
            ctx.stroke();
            requestAnimationFrame(draw);
        }

        document.getElementById('btn-toggle-mic').onclick = () => isRunning ? location.reload() : start();
    </script>
</body>
</html>
