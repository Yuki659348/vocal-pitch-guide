<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VOICE PITCH MONITOR</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3231/3231365.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        body { 
            font-family: 'Rajdhani', 'Noto Sans JP', sans-serif; 
            background-color: #05070a; 
            color: #e2e8f0; 
            overflow: hidden; 
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }
        .font-digital { font-family: 'Orbitron', sans-serif; }
    </style>
</head>
<body class="h-screen flex flex-col">

    <header class="flex-none flex justify-between items-center bg-gray-950/50 p-4 border-b border-gray-800 backdrop-blur-md">
        <h1 class="text-sm font-bold tracking-widest text-white/70">
            <span class="text-[#00e5ff] font-digital">PITCH MONITOR</span>
        </h1>
        <div id="status-pulse" class="w-2 h-2 rounded-full bg-gray-700"></div>
    </header>

    <main class="flex-grow flex flex-col md:flex-row p-4 gap-4 overflow-hidden">
        
        <section class="flex-none md:w-80 bg-gray-900/40 border border-gray-800 rounded-2xl p-6 flex flex-col items-center justify-center gap-2">
            <div id="current-note" class="font-digital text-6xl md:text-7xl font-black text-gray-700 transition-colors duration-300">--</div>
            <div id="current-octave" class="text-sm text-gray-400 font-digital tracking-widest mt-[-10px]">--</div>
            <div id="current-hz" class="text-lg text-gray-500 font-digital mt-2">0.00 Hz</div>
            
            <div class="mt-6 w-full grid grid-cols-2 gap-4 text-center">
                <div>
                    <div class="text-[10px] text-gray-500 uppercase tracking-widest">ビブラート</div>
                    <div id="vibrato-val" class="font-digital text-lg text-[#00ff9d]">0.0</div>
                </div>
                <div>
                    <div class="text-[10px] text-gray-500 uppercase tracking-widest">変化度</div>
                    <div id="change-val" class="font-digital text-lg text-[#ff007f]">Normal</div>
                </div>
            </div>
            
            <div class="w-full h-3 bg-black/40 rounded-full overflow-hidden relative border border-gray-800 mt-6">
                <div class="absolute left-1/2 top-0 bottom-0 w-px bg-white/20"></div>
                <div id="tuning-needle" class="absolute top-0 bottom-0 w-1 bg-[#00e5ff] left-1/2 -translate-x-1/2 transition-all duration-75"></div>
            </div>
        </section>

        <section class="flex-grow bg-black/20 border border-gray-800 rounded-2xl p-2 relative overflow-hidden">
            <canvas id="pitch-canvas" class="w-full h-full"></canvas>
        </section>
    </main>

    <footer class="flex-none p-4 pb-[max(1rem,env(safe-area-inset-bottom))]">
        <button id="btn-toggle-mic" class="w-full bg-[#00e5ff]/10 border border-[#00e5ff]/30 text-[#00e5ff] hover:bg-[#00e5ff]/20 font-bold py-4 rounded-xl flex items-center justify-center gap-3 transition active:scale-95">
            <i class="fa-solid fa-microphone"></i> <span id="btn-text">マイクを有効化</span>
        </button>
    </footer>

    <script>
        let audioContext = null, analyser = null, biquadFilter = null, micStream = null, isRunning = false;
        let pitchHistory = [], lastPitch = 0, smoothedPitch = 0;
        
        const canvas = document.getElementById('pitch-canvas');
        const ctx = canvas.getContext('2d');
        const currentNoteEl = document.getElementById('current-note'), currentHzEl = document.getElementById('current-hz'), currentOctaveEl = document.getElementById('current-octave');
        const tuningNeedle = document.getElementById('tuning-needle'), statusPulse = document.getElementById('status-pulse'), btnToggleMic = document.getElementById('btn-toggle-mic'), btnText = document.getElementById('btn-text');
        const vibratoEl = document.getElementById('vibrato-val'), changeEl = document.getElementById('change-val');

        function resizeCanvas() {
            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function autoCorrelate(buffer, sampleRate) {
            let size = buffer.length, rms = 0;
            for (let i = 0; i < size; i++) rms += buffer[i] * buffer[i];
            rms = Math.sqrt(rms / size);
            if (rms < 0.01) return -1;
            let c = new Float32Array(size);
            for (let i = 0; i < size; i++) for (let j = 0; j < size - i; j++) c[i] += buffer[j] * buffer[j + i];
            let bestT = -1, threshold = 0.2 * c[0];
            for (let i = 1; i < size; i++) if (c[i] > threshold && c[i] > c[i-1] && c[i] > c[i+1]) { bestT = i; break; }
            return bestT === -1 ? -1 : sampleRate / bestT;
        }

        async function startMonitoring() {
            try {
                if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
                if (audioContext.state === 'suspended') await audioContext.resume();
                micStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
                const source = audioContext.createMediaStreamSource(micStream);
                biquadFilter = audioContext.createBiquadFilter(); biquadFilter.type = "lowpass"; biquadFilter.frequency.value = 1000; 
                analyser = audioContext.createAnalyser(); analyser.fftSize = 2048;
                source.connect(biquadFilter); biquadFilter.connect(analyser);
                isRunning = true; btnText.textContent = "停止"; statusPulse.className = "w-2 h-2 rounded-full bg-emerald-400 animate-pulse";
                requestAnimationFrame(updateLoop);
            } catch (e) { alert("マイクへのアクセスを許可してください。"); }
        }

        function stopMonitoring() { if (micStream) micStream.getTracks().forEach(t => t.stop()); isRunning = false; btnText.textContent = "マイクを有効化"; statusPulse.className = "w-2 h-2 rounded-full bg-gray-700"; }
        btnToggleMic.addEventListener('click', () => isRunning ? stopMonitoring() : startMonitoring());

        function updateLoop() {
            if (!isRunning) return;
            const data = new Float32Array(analyser.fftSize); analyser.getFloatTimeDomainData(data);
            const pitch = autoCorrelate(data, audioContext.sampleRate);

            if (pitch > 60 && pitch < 1200) {
                smoothedPitch = (pitch * 0.1) + (smoothedPitch * 0.9);
                pitchHistory.push(smoothedPitch); if (pitchHistory.length > 100) pitchHistory.shift();
                
                let diff = smoothedPitch - lastPitch;
                vibratoEl.textContent = Math.abs(diff > 5 ? (diff * 0.5).toFixed(1) : 0);
                changeEl.textContent = Math.abs(diff) > 20 ? (diff > 0 ? "しゃくり" : "フォール") : "Normal";
                lastPitch = smoothedPitch;

                const midi = Math.round(12 * Math.log2(smoothedPitch
