<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VOICE PITCH MONITOR</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Rajdhani', sans-serif; background-color: #05070a; color: #e2e8f0; overflow: hidden; height: 100vh; }
        .font-digital { font-family: 'Orbitron', sans-serif; }
    </style>
</head>
<body class="flex flex-col h-screen">

    <header class="flex-none flex justify-between items-center p-4 border-b border-gray-800">
        <h1 class="text-xs font-bold tracking-widest text-white/50">PITCH TRACE MONITOR</h1>
        <div id="status-pulse" class="w-2 h-2 rounded-full bg-gray-700"></div>
    </header>

    <main class="flex-grow flex flex-col p-4 gap-4 overflow-hidden">
        <div class="bg-gray-900/40 p-5 rounded-2xl border border-gray-800">
            <div class="flex justify-between items-end">
                <div id="current-note" class="font-digital text-5xl font-black text-white leading-none">--</div>
                <div class="text-right text-[10px] text-gray-500 font-digital">
                    <div id="current-hz">0.00 Hz</div>
                    <div id="vibrato-status">Vibrato: 0.0 Hz</div>
                </div>
            </div>
            <div class="mt-4 w-full h-8 bg-black rounded-lg border border-gray-700 relative flex items-center">
                <div id="needle" class="absolute w-0.5 h-8 bg-cyan-400 transition-all duration-300 ease-out z-20 left-1/2"></div>
            </div>
        </div>
        
        <div class="flex-grow bg-black/20 border border-gray-800 rounded-2xl p-1 relative overflow-hidden">
            <canvas id="pitch-canvas" class="w-full h-full"></canvas>
            <div class="absolute bottom-4 right-4 bg-gray-900/80 p-2 rounded-lg border border-gray-700">
                <input id="zoom-slider" type="range" min="0.1" max="5" step="0.1" value="1.5" class="w-24 accent-cyan-500">
            </div>
        </div>
    </main>

    <footer class="p-4">
        <button id="btn-toggle-mic" class="w-full bg-cyan-900/30 border border-cyan-500/30 text-cyan-400 py-4 rounded-xl font-bold tracking-wider">
            マイクを有効化
        </button>
    </footer>

    <script>
        let audioContext, analyser, timeDomainData, isRunning = false;
        let pitchHistory = [];
        let smoothedPitch = 0;
        const MAX_HISTORY = 100;
        const SMOOTHING = 0.08; // ピッチ表示をゆっくり動かすための平滑化係数
        
        const canvas = document.getElementById('pitch-canvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        const btnToggleMic = document.getElementById('btn-toggle-mic');
        const zoomSlider = document.getElementById('zoom-slider');
        const needle = document.getElementById('needle');

        function resize() {
            canvas.width = canvas.clientWidth * window.devicePixelRatio;
            canvas.height = canvas.clientHeight * window.devicePixelRatio;
        }
        window.onresize = resize;
        resize();

        function autoCorrelate(buffer, sampleRate) {
            let size = buffer.length, rms = 0;
            for (let i = 0; i < size; i++) rms += buffer[i] * buffer[i];
            rms = Math.sqrt(rms / size);
            if (rms < 0.01) return -1;
            
            let c = new Float32Array(size);
            for (let i = 0; i < size; i++) for (let j = 0; j < size - i; j++) c[i] += buffer[j] * buffer[j + i];
            
            let bestT = -1, threshold = 0.2 * c[0];
            for (let i = 1; i < size; i++) if (c[i] > threshold && c[i] > c[i-1] && c[i] > c[i+1]) { bestT = i; break; }
            
            return bestT > 0 ? sampleRate / bestT : -1;
        }

        async function start() {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 2048;
            timeDomainData = new Float32Array(analyser.fftSize);
            audioContext.createMediaStreamSource(stream).connect(analyser);
            isRunning = true;
            btnToggleMic.textContent = "停止";
            requestAnimationFrame(draw);
        }

        function draw() {
            if (!isRunning) return;
            
            analyser.getFloatTimeDomainData(timeDomainData);
            const pitch = autoCorrelate(timeDomainData, audioContext.sampleRate);
            
            if (pitch > 40 && pitch < 2000) {
                // ピッチ表示用には強い平滑化を適用
                smoothedPitch = (SMOOTHING * pitch) + ((1.0 - SMOOTHING) * (smoothedPitch || pitch));
                
                // 軌跡用には生に近いデータを追従させる（高速追従）
                pitchHistory.push(pitch);
                if (pitchHistory.length > MAX_HISTORY) pitchHistory.shift();

                const midiNote = Math.round(12 * Math.log2(smoothedPitch / 440) + 69);
                const targetFreq = 440 * Math.pow(2, (midiNote - 69) / 12);
                const cents = 1200 * Math.log2(smoothedPitch / targetFreq);
                
                needle.style.left = `${Math.max(0, Math.min(100, (cents + 50)))}%`;
                
                const noteNames = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
                document.getElementById('current-note').textContent = noteNames[midiNote % 12];
                document.getElementById('current-hz').textContent = smoothedPitch.toFixed(1) + " Hz";
            }

            ctx.fillStyle = '#05070a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // グリッド
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 1;
            for(let i = 0; i <= 10; i++) {
                ctx.beginPath();
                ctx.moveTo(canvas.width * (i/10), 0);
                ctx.lineTo(canvas.width * (i/10), canvas.height);
                ctx.stroke();
            }
            for(let i = 0; i <= 8; i++) {
                ctx.beginPath();
                ctx.moveTo(0, canvas.height * (i/8));
                ctx.lineTo(canvas.width, canvas.height * (i/8));
                ctx.stroke();
            }

            // 高速追従する軌跡
            ctx.strokeStyle = '#f472b6';
            ctx.lineWidth = 3;
            ctx.beginPath();
            const h = canvas.height;
            const w = canvas.width;
            pitchHistory.forEach((p, i) => {
                const x = (i / MAX_HISTORY) * w;
                const y = h - ((Math.log2(p/60) / Math.log2(1500/60)) * h);
                i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
            });
            ctx.stroke();

            requestAnimationFrame(draw);
        }

        btnToggleMic.onclick = () => isRunning ? location.reload() : start();
    </script>
</body>
</html>
