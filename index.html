<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VOICE PITCH MONITOR</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3231/3231365.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        body { font-family: 'Rajdhani', 'Noto Sans JP', sans-serif; background-color: #0b0f19; color: #e2e8f0; overflow: hidden; padding-top: env(safe-area-inset-top); }
        .font-digital { font-family: 'Orbitron', sans-serif; }
    </style>
</head>
<body class="h-screen flex flex-col p-4">

    <header class="flex justify-between items-center bg-gray-900/80 p-4 rounded-xl border border-gray-800 backdrop-blur">
        <h1 class="text-lg font-bold tracking-wider text-white">
            <span class="text-[#00e5ff] font-digital">VOICE PITCH MONITOR</span>
        </h1>
        <div id="status-pulse" class="w-3 h-3 rounded-full bg-gray-600"></div>
    </header>

    <main class="flex-grow grid grid-cols-1 md:grid-cols-3 gap-4 my-4">
        
        <section class="bg-gray-900/60 border border-gray-800 rounded-xl p-6 flex flex-col items-center justify-center gap-4">
            <div id="current-note" class="font-digital text-8xl font-black text-gray-600">--</div>
            <div id="current-hz" class="text-xl text-gray-500 font-digital">0.00 Hz</div>
            
            <div class="w-full h-4 bg-black/60 rounded-full overflow-hidden relative border border-gray-800 mt-4">
                <div class="absolute left-1/2 top-0 bottom-0 w-0.5 bg-[#00e5ff]/60"></div>
                <div id="tuning-needle" class="absolute top-0 bottom-0 w-1.5 bg-gray-400 left-1/2 -translate-x-1/2 transition-all duration-75"></div>
            </div>
            <div id="cents-label" class="text-sm font-digital text-gray-400">0 cents</div>
        </section>

        <section class="md:col-span-2 bg-black/40 border border-gray-800 rounded-xl p-2 relative">
            <canvas id="pitch-canvas" class="w-full h-full rounded-lg"></canvas>
        </section>
    </main>

    <footer class="bg-gray-900/80 p-4 rounded-xl border border-gray-800">
        <button id="btn-toggle-mic" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-4 rounded-lg flex items-center justify-center gap-3 active:scale-95 transition">
            <i class="fa-solid fa-microphone"></i> <span id="btn-text">マイクを有効化する</span>
        </button>
    </footer>

    <script>
        let audioContext = null;
        let analyser = null;
        let biquadFilter = null;
        let micStream = null;
        let isRunning = false;
        let smoothedPitch = 0;
        
        const canvas = document.getElementById('pitch-canvas');
        const ctx = canvas.getContext('2d');
        const currentNoteEl = document.getElementById('current-note');
        const currentHzEl = document.getElementById('current-hz');
        const tuningNeedle = document.getElementById('tuning-needle');
        const centsLabel = document.getElementById('cents-label');
        const statusPulse = document.getElementById('status-pulse');
        const btnToggleMic = document.getElementById('btn-toggle-mic');
        const btnText = document.getElementById('btn-text');

        // 倍音をカットするための自己相関強化版アルゴリズム
        function autoCorrelate(buffer, sampleRate) {
            let size = buffer.length;
            let rms = 0;
            for (let i = 0; i < size; i++) rms += buffer[i] * buffer[i];
            rms = Math.sqrt(rms / size);
            if (rms < 0.01) return -1; // ノイズゲートを少し引き上げ

            // 自己相関
            let c = new Float32Array(size);
            for (let i = 0; i < size; i++) {
                for (let j = 0; j < size - i; j++) c[i] += buffer[j] * buffer[j + i];
            }

            // 基音付近（高い周波数から順にチェックし、最初の大きな山を探す）
            let bestT = -1;
            let threshold = 0.2 * c[0];
            for (let i = 1; i < size; i++) {
                if (c[i] > threshold && c[i] > c[i-1] && c[i] > c[i+1]) {
                    bestT = i;
                    break;
                }
            }
            return bestT === -1 ? -1 : sampleRate / bestT;
        }

        async function startMonitoring() {
            try {
                if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
                if (audioContext.state === 'suspended') await audioContext.resume();

                micStream = await navigator.mediaDevices.getUserMedia({ 
                    audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } 
                });
                const source = audioContext.createMediaStreamSource(micStream);
                
                // ローパスフィルターを追加して基音成分を強調
                biquadFilter = audioContext.createBiquadFilter();
                biquadFilter.type = "lowpass";
                biquadFilter.frequency.value = 1000; 

                analyser = audioContext.createAnalyser();
                analyser.fftSize = 2048;
                
                source.connect(biquadFilter);
                biquadFilter.connect(analyser);
                
                isRunning = true;
                btnText.textContent = "マイクを切断";
                btnToggleMic.className = "w-full bg-red-600 hover:bg-red-500 text-white font-bold py-4 rounded-lg flex items-center justify-center gap-3";
                statusPulse.className = "w-3 h-3 rounded-full bg-emerald-500 animate-pulse";
                requestAnimationFrame(updateLoop);
            } catch (e) {
                alert("マイクアクセス不可: " + e.message);
            }
        }

        function stopMonitoring() {
            if (micStream) micStream.getTracks().forEach(t => t.stop());
            isRunning = false;
            btnText.textContent = "マイクを有効化する";
            btnToggleMic.className = "w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-4 rounded-lg flex items-center justify-center gap-3";
            statusPulse.className = "w-3 h-3 rounded-full bg-gray-600";
        }

        btnToggleMic.addEventListener('click', () => isRunning ? stopMonitoring() : startMonitoring());

        function updateLoop() {
            if (!isRunning) return;
            const data = new Float32Array(analyser.fftSize);
            analyser.getFloatTimeDomainData(data);
            const pitch = autoCorrelate(data, audioContext.sampleRate);

            if (pitch > 60 && pitch < 1200) {
                // 指数移動平均(EMA)をさらに強めて安定化
                smoothedPitch = (pitch * 0.1) + (smoothedPitch * 0.9);
                
                const midi = Math.round(12 * Math.log2(smoothedPitch / 440) + 69);
                const noteNames = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
                
                currentNoteEl.textContent = noteNames[midi % 12];
                currentNoteEl.className = "font-digital text-8xl font-black text-[#ff007f]";
                currentHzEl.textContent = smoothedPitch.toFixed(1) + " Hz";
                
                const cents = 1200 * Math.log2(smoothedPitch / (440 * Math.pow(2, (midi - 69) / 12)));
                centsLabel.textContent = Math.round(cents) + " cents";
                tuningNeedle.style.left = Math.max(0, Math.min(100, 50 + cents)) + "%";
            }

            requestAnimationFrame(updateLoop);
        }
    </script>
</body>
</html>
