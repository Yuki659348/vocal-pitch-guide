<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VOICE PITCH MONITOR</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Rajdhani', sans-serif; background-color: #05070a; color: #e2e8f0; overflow: hidden; height: 100vh; }
        .font-digital { font-family: 'Orbitron', sans-serif; }
    </style>
</head>
<body class="flex flex-col h-screen">

    <header class="flex-none flex justify-between items-center p-4 border-b border-gray-800">
        <h1 class="text-xs font-bold tracking-widest text-white/50">PITCH MONITOR LITE</h1>
        <div id="status-pulse" class="w-2 h-2 rounded-full bg-gray-700"></div>
    </header>

    <main class="flex-grow flex flex-col p-4 gap-4 overflow-hidden">
        <div class="bg-gray-900/40 p-5 rounded-2xl border border-gray-800">
            <div id="current-note" class="font-digital text-6xl font-black text-white leading-none">--</div>
            <div id="current-hz" class="text-xs text-gray-400 font-digital mt-1">0.00 Hz</div>
        </div>
        <div class="flex-grow bg-black/20 border border-gray-800 rounded-2xl p-1 relative overflow-hidden">
            <canvas id="pitch-canvas" class="w-full h-full"></canvas>
        </div>
    </main>

    <footer class="p-4">
        <button id="btn-toggle-mic" class="w-full bg-cyan-900/30 border border-cyan-500/30 text-cyan-400 py-4 rounded-xl font-bold tracking-wider">
            マイクを有効化
        </button>
    </footer>

    <script>
        let audioContext, analyser, biquadFilter, timeDomainData, isRunning = false;
        let frameCounter = 0;
        const canvas = document.getElementById('pitch-canvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        const btnToggleMic = document.getElementById('btn-toggle-mic');

        function resize() {
            canvas.width = canvas.clientWidth * window.devicePixelRatio;
            canvas.height = canvas.clientHeight * window.devicePixelRatio;
        }
        window.onresize = resize;
        resize();

        function autoCorrelate(buffer, sampleRate) {
            let size = buffer.length, rms = 0;
            for (let i = 0; i < size; i++) rms += buffer[i] * buffer[i];
            if (Math.sqrt(rms / size) < 0.01) return -1;
            
            let c = new Float32Array(size);
            for (let i = 0; i < size; i++) for (let j = 0; j < size - i; j++) c[i] += buffer[j] * buffer[j + i];
            
            let bestT = -1, threshold = 0.3 * c[0];
            for (let i = 1; i < size; i++) if (c[i] > threshold && c[i] > c[i-1] && c[i] > c[i+1]) { bestT = i; break; }
            
            return bestT > 0 ? sampleRate / bestT : -1;
        }

        async function start() {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            
            // ローパスフィルタの追加：高域ノイズをカットして解析を安定化
            biquadFilter = audioContext.createBiquadFilter();
            biquadFilter.type = "lowpass";
            biquadFilter.frequency.value = 2000;
            
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 2048;
            timeDomainData = new Float32Array(analyser.fftSize);
            
            const source = audioContext.createMediaStreamSource(stream);
            source.connect(biquadFilter);
            biquadFilter.connect(analyser);
            
            isRunning = true;
            btnToggleMic.textContent = "停止";
            requestAnimationFrame(draw);
        }

        function draw() {
            if (!isRunning) return;
            frameCounter++;
            
            // 3フレームに1回だけ計算を行う（解析頻度の間引き）
            if (frameCounter % 3 === 0) {
                analyser.getFloatTimeDomainData(timeDomainData);
                const pitch = autoCorrelate(timeDomainData, audioContext.sampleRate);
                
                if (pitch > 40) {
                    const noteNames = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
                    document.getElementById('current-note').textContent = noteNames[Math.round(12 * Math.log2(pitch / 440) + 69) % 12];
                    document.getElementById('current-hz').textContent = pitch.toFixed(1) + " Hz";
                }
            }

            // 描画処理：負荷を抑えるために簡素化
            ctx.fillStyle = '#05070a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = '#22d3ee';
            ctx.lineWidth = 2;
            ctx.beginPath();
            const slice = canvas.width / 128; // 表示する波形のデータ量を制限
            for (let i = 0; i < 128; i++) {
                const x = i * slice;
                const y = (timeDomainData[i * 16] * canvas.height / 2) + canvas.height / 2;
                i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
            }
            ctx.stroke();
            requestAnimationFrame(draw);
        }

        btnToggleMic.onclick = () => isRunning ? location.reload() : start();
    </script>
</body>
</html>
